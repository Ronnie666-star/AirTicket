# ===== 公共配置（本地测试与 Docker 交付共用） =====
spring:
  application:
    name: airTicket
  profiles:
    # 默认走本地测试；Docker 交付由环境变量 SPRING_PROFILES_ACTIVE=docker 覆盖。
    # 注意：不要写 spring.profiles.active 硬编码，否则会压过外部注入。
    default: test
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
  flyway:
    enabled: true
    locations: classpath:db/migration

mybatis:
  mapper-locations: classpath:/mapper/**/*.xml
  type-aliases-package: com.ronnie.airTicket.infrastructure.persistence.po
  configuration:
    # 下划线->驼峰自动映射：sys_user.real_name 直接映射到 realName，SQL 不用起别名
    map-underscore-to-camel-case: true

server:
  port: 8080

# ===== CORS：允许的来源，生产由环境变量覆盖（逗号分隔），默认放行本地前端 =====
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# ===== Actuator：只暴露 health/info；health 带明细（含数据库连通性） =====
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

# ===== 日志：level 里带 MDC 的 requestId，一次请求的日志用 requestId 串起来 =====
logging:
  pattern:
    level: "%5p [%X{requestId}]"

# ===== JWT 配置（敏感值不写死，从环境变量注入） =====
jwt:
  # 密钥 / 有效期都来自环境变量：本地由 spring-dotenv 读取 backend/.env，
  # Docker 由 compose 的 env_file 或 docker run --env-file 注入同名变量。
  # 密钥长度必须 >= 32 字节，否则 HS256 验签会抛 WeakKeyException。
  # 带默认值兜底：从 IDEA 等以项目根为工作目录启动时读不到 backend/.env 也能起来（.env 仍优先）。
  secret: ${JWT_SECRET:airTicket-please-change-this-secret-key-0123456789}
  expire-hours: ${JWT_EXPIRE_HOURS:24}

# ===== 模拟支付渠道：回调端点（POST /pay/callback）的鉴权令牌 =====
# 由 env PAY_CALLBACK_TOKEN 注入；缺省用演示默认值（课程环境足够，公网需改强）。
pay:
  channel:
    callback-token: ${PAY_CALLBACK_TOKEN:channel-simulate-secret}

# ===== spring-dotenv：本地启动时把 backend/.env 注入 Spring 环境 =====
springdotenv:
  enabled: true
  # 相对启动时的工作目录；在 backend/ 下运行 mvn spring-boot:run 即读到 backend/.env
  directory: .
  filename: .env
  # 文件缺失 / 格式异常时不报错，按空配置处理 —— Docker 镜像里没有 .env，靠容器真实环境变量注入
  ignore-if-missing: true
  ignore-if-malformed: true

# ===== 公共配置（本地测试与 Docker 交付共用） =====
spring:
  application:
    name: airTicket
  profiles:
    # 默认走本地测试；Docker 交付由 compose 注入 SPRING_PROFILES_ACTIVE=docker 覆盖。
    # 注意：不要写 spring.profiles.active 硬编码，否则会压过 compose 注入。
    default: test
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

server:
  port: 8080

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.ronnie.airTicket.infrastructure.persistence.po
  configuration:
    map-underscore-to-camel-case: true

jwt:
  # HS256 要求密钥 >= 32 字节，交付前请替换为强随机串
  secret: change-me-in-prod-please-set-a-strong-secret-key-at-least-32-bytes
  expire-minutes: 1440

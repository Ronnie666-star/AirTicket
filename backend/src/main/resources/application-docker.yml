# ===== Docker 交付环境：compose 注入 SPRING_PROFILES_ACTIVE=docker 时生效 =====
# 数据库：同一 compose 内网，容器名 mysql_airTicket 即主机名，端口 3306
spring:
  datasource:
    url: jdbc:mysql://mysql_airTicket:3306/flights?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
